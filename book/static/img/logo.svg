<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head Outline -->
  <rect x="12" y="20" width="40" height="36" rx="6" fill="none" stroke="#2e8555" stroke-width="2.5"/>

  <!-- Antenna -->
  <line x1="32" y1="20" x2="32" y2="8" stroke="#2e8555" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Antenna Signal Dot -->
  <circle cx="32" cy="5" r="3" fill="#2e8555"/>

  <!-- Left Eye -->
  <circle cx="24" cy="34" r="5" fill="#2e8555"/>

  <!-- Right Eye -->
  <circle cx="40" cy="34" r="5" fill="#2e8555"/>

  <!-- Mouth / Speaker Grille -->
  <rect x="22" y="44" width="20" height="6" rx="2" fill="none" stroke="#2e8555" stroke-width="1.5"/>

  <!-- Neural Network Lines - Left -->
  <path d="M8 28 L12 32" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M8 38 L12 38" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M8 48 L12 44" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Neural Network Lines - Right -->
  <path d="M56 28 L52 32" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M56 38 L52 38" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M56 48 L52 44" stroke="#33925d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Neural Nodes -->
  <circle cx="6" cy="28" r="2" fill="#33925d" opacity="0.6"/>
  <circle cx="6" cy="38" r="2" fill="#33925d" opacity="0.6"/>
  <circle cx="6" cy="48" r="2" fill="#33925d" opacity="0.6"/>
  <circle cx="58" cy="28" r="2" fill="#33925d" opacity="0.6"/>
  <circle cx="58" cy="38" r="2" fill="#33925d" opacity="0.6"/>
  <circle cx="58" cy="48" r="2" fill="#33925d" opacity="0.6"/>
</svg>
