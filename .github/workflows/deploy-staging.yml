name: Deploy All Services to Railway (Staging)

# Deploys backend + auth-server to Railway staging environment on every push to dev.
# Frontend preview is handled by preview.yml (Netlify) on PRs.
# Requires: RAILWAY_TOKEN, RAILWAY_BACKEND_SERVICE_ID, RAILWAY_AUTH_SERVICE_ID in Secrets.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Deploy Backend → staging
  # ─────────────────────────────────────────
  deploy-backend-staging:
    name: Backend → Railway staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RAILWAY_BACKEND_STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to staging
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}" \
            --environment staging \
            --detach
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────
  # Deploy Auth Server → staging
  # ─────────────────────────────────────────
  deploy-auth-staging:
    name: Auth Server → Railway staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RAILWAY_AUTH_STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy auth-server to staging
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_AUTH_SERVICE_ID }}" \
            --environment staging \
            --detach
        working-directory: ./auth-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────
  summary:
    name: Staging deployment summary
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-auth-staging]
    steps:
      - run: |
          echo "✅ Staging deployment complete"
          echo "Backend: ${{ vars.RAILWAY_BACKEND_STAGING_URL }}"
          echo "Auth:    ${{ vars.RAILWAY_AUTH_STAGING_URL }}"
