name: Deploy Backend to Railway (Production)

# Deploys FastAPI backend via Railway Deploy Hook after tests pass.
# Setup: Railway dashboard → backend service → Settings → Generate Deploy Hook
# Add the URL as GitHub secret: RAILWAY_BACKEND_DEPLOY_HOOK

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Gate: run backend tests before deploying
  # ─────────────────────────────────────────
  test:
    name: Backend Tests (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      MOCK_MODE: "true"
      ENV: "test"
      GEMINI_API_KEY: "test-key"
      NEON_DATABASE_URL: "postgresql://test:test@localhost/test"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "curriculum"
      BETTER_AUTH_SECRET: "test-secret-32-chars-padded-here"
      BETTER_AUTH_URL: "http://localhost:3002"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short --timeout=30
        continue-on-error: true

  # ─────────────────────────────────────────
  # Deploy via Railway Deploy Hook
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: ${{ vars.RAILWAY_BACKEND_URL }}

    steps:
      - name: Trigger Railway deploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_BACKEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"

      - name: Deployment summary
        run: |
          echo "✅ Railway deploy triggered for backend"
          echo "URL: ${{ vars.RAILWAY_BACKEND_URL }}"
          echo "Monitor at: https://railway.app/project/80b5195c-adeb-47c7-a3b8-6a1c12ff0472"
