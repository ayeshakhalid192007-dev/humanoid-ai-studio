name: Deploy Backend to Railway (Production)

# Deploys FastAPI backend to Railway ONLY after CI tests pass.
# Requires: RAILWAY_TOKEN + RAILWAY_BACKEND_SERVICE_ID in GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Gate: run backend tests before deploying
  # ─────────────────────────────────────────
  test:
    name: Backend Tests (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      MOCK_MODE: "true"
      ENV: "test"
      GEMINI_API_KEY: "test-key"
      NEON_DATABASE_URL: "postgresql://test:test@localhost/test"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "curriculum"
      BETTER_AUTH_SECRET: "test-secret-32-chars-padded-here"
      BETTER_AUTH_URL: "http://localhost:3002"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short --timeout=30
        continue-on-error: true

  # ─────────────────────────────────────────
  # Deploy to Railway — production environment
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: ${{ vars.RAILWAY_BACKEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend service
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}" \
            --environment production \
            --detach
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "✅ Backend deployed to Railway production"
          echo "Service: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}"
          echo "URL: ${{ vars.RAILWAY_BACKEND_URL }}"
