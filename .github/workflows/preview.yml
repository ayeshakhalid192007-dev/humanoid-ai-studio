name: PR Preview — Netlify Deploy

# Deploys Docusaurus frontend to Netlify as a draft preview on every PR.
# Posts the preview URL as a PR comment automatically.
# Requires: NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID in GitHub Secrets.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "book/**"

jobs:
  preview:
    name: Build & Deploy Preview to Netlify
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # needed to post comment

    defaults:
      run:
        working-directory: ./book

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build
        env:
          # Use placeholder URLs for previews — real services are not called at build time
          BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL || 'https://placeholder.railway.app' }}
          AUTH_API_URL: ${{ vars.RAILWAY_AUTH_URL || 'https://placeholder.railway.app' }}

      - name: Deploy draft to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./book/build
          production-deploy: false          # draft/preview — never touches production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ github.event.number }} — ${{ github.head_ref }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
          alias: pr-${{ github.event.number }}  # stable per-PR URL
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Print preview URL
        run: echo "Preview URL ${{ steps.netlify.outputs.deploy-url }}"
