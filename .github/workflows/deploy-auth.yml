name: Deploy — Auth Server

on:
  push:
    branches: [main]
    paths:
      - 'auth-server/**'
      - '.github/workflows/deploy-auth.yml'

jobs:
  deploy:
    name: Deploy Auth Server to Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy auth-server
        run: railway up auth-server --path-as-root --service auth-server --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN2 }}
