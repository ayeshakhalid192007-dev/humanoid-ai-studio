name: Deploy Auth Server to Railway (Production)

# Deploys Express auth server via Railway Deploy Hook after audit passes.
# Setup: Railway dashboard → auth-server service → Settings → Generate Deploy Hook
# Add the URL as GitHub secret: RAILWAY_AUTH_DEPLOY_HOOK

on:
  push:
    branches: [main]
    paths:
      - "auth-server/**"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Gate: audit before deploying
  # ─────────────────────────────────────────
  audit:
    name: Auth Server Audit (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth-server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────
  # Deploy via Railway Deploy Hook
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: audit
    environment:
      name: production
      url: ${{ vars.RAILWAY_AUTH_URL }}

    steps:
      - name: Trigger Railway deploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_AUTH_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"

      - name: Deployment summary
        run: |
          echo "✅ Railway deploy triggered for auth-server"
          echo "URL: ${{ vars.RAILWAY_AUTH_URL }}"
          echo "Monitor at: https://railway.app/project/80b5195c-adeb-47c7-a3b8-6a1c12ff0472"
