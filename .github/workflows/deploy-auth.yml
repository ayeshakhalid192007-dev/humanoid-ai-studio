name: Deploy Auth Server to Railway (Production)

# Deploys Express + Better Auth server to Railway ONLY when auth-server/ changes.
# Requires: RAILWAY_TOKEN + RAILWAY_AUTH_SERVICE_ID in GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - "auth-server/**"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Gate: audit before deploying
  # ─────────────────────────────────────────
  audit:
    name: Auth Server Audit (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth-server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────
  # Deploy to Railway — production environment
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: audit
    environment:
      name: production
      url: ${{ vars.RAILWAY_AUTH_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy auth-server service
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_AUTH_SERVICE_ID }}" \
            --environment production \
            --detach
        working-directory: ./auth-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "✅ Auth server deployed to Railway production"
          echo "Service: ${{ secrets.RAILWAY_AUTH_SERVICE_ID }}"
          echo "URL: ${{ vars.RAILWAY_AUTH_URL }}"
