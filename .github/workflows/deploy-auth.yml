name: Deploy Auth Server to Railway (Production)

# Uses Railway's official GitHub Action — no RAILWAY_TOKEN needed.
# Deploys only when auth-server/ changes.

on:
  push:
    branches: [main]
    paths:
      - "auth-server/**"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Gate: audit before deploying
  # ─────────────────────────────────────────
  audit:
    name: Auth Server Audit (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth-server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────
  # Deploy to Railway via official action
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: audit
    environment:
      name: production
      url: ${{ vars.RAILWAY_AUTH_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy auth-server to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_AUTH_SERVICE_ID }}
          detach: true

      - name: Deployment summary
        run: |
          echo "✅ Auth server deployed to Railway production"
          echo "URL: ${{ vars.RAILWAY_AUTH_URL }}"
